<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Ivy Sanctum Library</title>

  <meta
    name="description"
    content="The Ivy Sanctum Library — admissions instruments and private editions devoted to the architecture of selective admissions."
  >

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    :root {
      --cream: #f4f0e6;
      --cream-soft: #f8f5ed;
      --oxblood: #6e1423;
      --charcoal: #24211f;
      --muted: #736c64;
      --line: rgba(36, 33, 31, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--charcoal);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
    }

    .shell {
      width: min(1220px, calc(100% - 56px));
      margin: 0 auto;
    }

    /* --------------------------------
       IMPRINT HEADER
    -------------------------------- */

    .library-header {
      padding: 28px 0 36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }

    .house-mark {
      color: var(--oxblood);
      font-size: 0.79rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .quiet-nav {
      display: flex;
      gap: 24px;
      font-size: 0.82rem;
    }

    .quiet-nav a {
      text-decoration: none;
      color: var(--muted);
    }

    .imprint {
      text-align: center;
      padding: 46px 0 25px;
    }

    .imprint-house {
      font-size: 0.72rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .imprint h1 {
      margin: 0;
      color: var(--oxblood);
      font-size: clamp(3rem, 5.5vw, 5.5rem);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.035em;
    }

    .imprint-rule {
      width: 150px;
      height: 1px;
      background: var(--oxblood);
      margin: 24px auto 17px;
    }

    .imprint-subtitle {
      margin: 0;
      font-style: italic;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* --------------------------------
       CATALOGUE
    -------------------------------- */

    .catalogue {
      border-top: 1px solid var(--line);
      padding: 36px 0 52px;
    }

    .catalogue-intro {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 38px;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .shelf {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 42px;
      align-items: start;
    }

    .book {
      text-align: center;
    }

    .cover-button {
      display: block;
      width: fit-content;
      margin: 0 auto;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .cover {
      display: block;
      width: auto;
      height: min(39vh, 355px);
      max-width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;

      box-shadow:
        0 10px 26px rgba(36, 33, 31, 0.11),
        0 2px 7px rgba(36, 33, 31, 0.06);

      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .cover-button:hover .cover {
      transform: translateY(-3px);

      box-shadow:
        0 15px 34px rgba(36, 33, 31, 0.14),
        0 3px 9px rgba(36, 33, 31, 0.07);
    }

    .book-meta {
      max-width: 330px;
      margin: 20px auto 0;
    }
